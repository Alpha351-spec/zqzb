<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="随机数生成器 - 在线生成指定范围随机整数或小数。所有处理均在本地完成。">
    <title>随机数生成器 - 杂七杂八工具箱</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3874070867090849" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <noscript>
            <div style="background: #fff3cd; border: 1px solid #ffecb5; border-radius: 12px; padding: 16px; margin-bottom: 24px; color: #856404;">
                ⚠️ 您的浏览器未启用 JavaScript。本工具箱的所有工具都需要 JavaScript 支持才能正常运行，请启用 JavaScript 后重试。
            </div>
        </noscript>
        <nav class="nav-bar">
            <a href="../">← 返回工具箱</a>
            <a href="../qr-generator/">二维码生成</a>
            <a href="../random-password/">随机密码</a>
            <a href="../timestamp/">时间戳转换</a>
            <a href="../random-number/" class="active">随机数生成</a>
            <a href="../uuid-generator/">UUID生成</a>
        </nav>

        <main>
            <h1 class="tool-title">随机数生成器</h1>
            <p class="tool-desc">生成指定范围随机整数或小数。所有处理均在本地完成。</p>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="input-group">
                    <label for="minInput">最小值</label>
                    <input type="number" id="minInput" value="1">
                </div>
                <div class="input-group">
                    <label for="maxInput">最大值</label>
                    <input type="number" id="maxInput" value="100">
                </div>
            </div>

            <div class="input-group">
                <label for="countInput">生成数量</label>
                <input type="number" id="countInput" value="1" min="1" max="1000">
            </div>

            <div style="display: flex; gap: 16px; margin-bottom: 24px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555555;">
                    <input type="radio" name="type" value="integer" checked style="width: 18px; height: 18px; accent-color: #009DFF;">
                    整数
                </label>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555555;">
                    <input type="radio" name="type" value="decimal" style="width: 18px; height: 18px; accent-color: #009DFF;">
                    小数
                </label>
            </div>

            <div class="input-group" id="decimalGroup" style="display: none;">
                <label for="decimalInput">小数位数</label>
                <input type="number" id="decimalInput" value="2" min="1" max="10">
            </div>

            <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                <button class="btn btn-primary" id="generateBtn">生成随机数</button>
                <button class="btn" id="copyBtn">复制结果</button>
            </div>

            <div class="result-area" id="resultArea" style="display: none;">
                <pre id="resultText" style="font-size: 18px; font-weight: 500;"></pre>
            </div>
        </main>

        <div class="recommend-section">
            <h3>其他工具</h3>
            <div class="recommend-links">
                <a href="../random-password/">随机密码</a>
                <a href="../uuid-generator/">UUID生成</a>
            </div>
        </div>

        <footer>
            <p>&copy; <span class="current-year">2024</span> 杂七杂八工具箱 | <a href="../about.html">关于</a> | <a href="../privacy.html">隐私政策</a> | <a href="../guide.html">使用指南</a></p>
        </footer>
    </div>

    <script src="../js/common.js"></script>
    <script>
        var minInput = document.getElementById('minInput');
        var maxInput = document.getElementById('maxInput');
        var countInput = document.getElementById('countInput');
        var decimalInput = document.getElementById('decimalInput');
        var decimalGroup = document.getElementById('decimalGroup');
        var generateBtn = document.getElementById('generateBtn');
        var copyBtn = document.getElementById('copyBtn');
        var resultArea = document.getElementById('resultArea');
        var resultText = document.getElementById('resultText');
        var lastResult = '';

        document.querySelectorAll('input[name="type"]').forEach(function(radio) {
            radio.addEventListener('change', function() {
                decimalGroup.style.display = this.value === 'decimal' ? 'block' : 'none';
            });
        });

        generateBtn.addEventListener('click', function() {
            var min = parseFloat(minInput.value);
            var max = parseFloat(maxInput.value);
            var count = parseInt(countInput.value);
            var type = document.querySelector('input[name="type"]:checked').value;
            var decimals = parseInt(decimalInput.value);

            if (isNaN(min) || isNaN(max)) { alert('请输入有效的最小值和最大值'); return; }
            if (min >= max) { alert('最小值必须小于最大值'); return; }
            if (isNaN(count) || count < 1) { alert('请输入有效的数量'); return; }

            var results = [];
            for (var i = 0; i < count; i++) {
                if (type === 'integer') {
                    results.push(Math.floor(Math.random() * (max - min + 1)) + min);
                } else {
                    var num = Math.random() * (max - min) + min;
                    results.push(num.toFixed(decimals));
                }
            }

            lastResult = results.join('\n');
            resultText.textContent = lastResult;
            resultArea.style.display = 'block';
        });

        copyBtn.addEventListener('click', function() {
            if (!lastResult) return;
            navigator.clipboard.writeText(lastResult).then(function() {
                copyBtn.textContent = '已复制';
                setTimeout(function() { copyBtn.textContent = '复制结果'; }, 2000);
            });
        });
    </script>
</body>
</html>
