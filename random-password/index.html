<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="随机密码生成 - 在线生成随机密码，自定义长度和字符类型，一键复制。所有处理均在本地完成。">
    <title>随机密码生成 - 杂七杂八工具箱</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3874070867090849" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .password-display {
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 24px;
        }
        .password-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 24px;
            color: #111111;
            word-break: break-all;
            margin-bottom: 12px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555555;
        }
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #009DFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <noscript>
            <div style="background: #fff3cd; border: 1px solid #ffecb5; border-radius: 12px; padding: 16px; margin-bottom: 24px; color: #856404;">
                ⚠️ 您的浏览器未启用 JavaScript。本工具箱的所有工具都需要 JavaScript 支持才能正常运行，请启用 JavaScript 后重试。
            </div>
        </noscript>
        <nav class="nav-bar">
            <a href="../">← 返回工具箱</a>
            <a href="../qr-generator/">二维码生成</a>
            <a href="../random-password/" class="active">随机密码生成</a>
            <a href="../timestamp/">时间戳转换</a>
            <a href="../random-number/">随机数生成</a>
            <a href="../uuid-generator/">UUID生成</a>
        </nav>

        <main>
            <h1 class="tool-title">随机密码生成</h1>
            <p class="tool-desc">生成随机密码，自定义长度和字符类型，一键复制。所有处理均在本地完成。</p>

            <div class="input-group">
                <label>密码长度: <span id="lengthValue">16</span></label>
                <div class="range-container">
                    <input type="range" id="lengthRange" min="6" max="64" value="16">
                </div>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="uppercase" checked> 大写字母 (A-Z)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="lowercase" checked> 小写字母 (a-z)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="numbers" checked> 数字 (0-9)
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="symbols" checked> 特殊字符 (!@#$...)
                </label>
            </div>

            <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                <button class="btn btn-primary" id="generateBtn">生成密码</button>
                <button class="btn" id="copyBtn">复制密码</button>
            </div>

            <div class="password-display">
                <div class="password-text" id="passwordText">点击"生成密码"按钮</div>
            </div>

            <div class="input-group">
                <label>批量生成（每行一个）</label>
                <div class="range-container">
                    <input type="range" id="batchRange" min="1" max="10" value="5">
                    <span class="range-value" id="batchValue">5</span>
                </div>
            </div>
            <button class="btn" id="batchBtn">批量生成</button>

            <div class="result-area" id="batchResult" style="display: none;">
                <pre id="batchOutput"></pre>
            </div>
        </main>

        <div class="recommend-section">
            <h3>其他工具</h3>
            <div class="recommend-links">
                <a href="../qr-generator/">二维码生成</a>
            </div>
        </div>

        <footer>
            <p>&copy; <span class="current-year">2024</span> 杂七杂八工具箱 | <a href="../about.html">关于</a> | <a href="../privacy.html">隐私政策</a> | <a href="../guide.html">使用指南</a></p>
        </footer>
    </div>

    <script src="../js/common.js"></script>
    <script>
        var lengthRange = document.getElementById('lengthRange');
        var lengthValue = document.getElementById('lengthValue');
        var uppercase = document.getElementById('uppercase');
        var lowercase = document.getElementById('lowercase');
        var numbers = document.getElementById('numbers');
        var symbols = document.getElementById('symbols');
        var generateBtn = document.getElementById('generateBtn');
        var copyBtn = document.getElementById('copyBtn');
        var passwordText = document.getElementById('passwordText');
        var batchRange = document.getElementById('batchRange');
        var batchValue = document.getElementById('batchValue');
        var batchBtn = document.getElementById('batchBtn');
        var batchResult = document.getElementById('batchResult');
        var batchOutput = document.getElementById('batchOutput');

        function updateRangeBackground(range, min, max) {
            var value = range.value;
            var percentage = ((value - min) / (max - min)) * 100;
            range.style.background = 'linear-gradient(to right, #009DFF 0%, #009DFF ' + percentage + '%, #eaeaea ' + percentage + '%, #eaeaea 100%)';
        }

        lengthRange.addEventListener('input', function() {
            lengthValue.textContent = this.value;
            updateRangeBackground(this, 6, 64);
        });

        batchRange.addEventListener('input', function() {
            batchValue.textContent = this.value;
            updateRangeBackground(this, 1, 10);
        });

        updateRangeBackground(lengthRange, 6, 64);
        updateRangeBackground(batchRange, 1, 10);

        function generatePassword() {
            var chars = '';
            if (uppercase.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (lowercase.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (numbers.checked) chars += '0123456789';
            if (symbols.checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            if (!chars) {
                alert('请至少选择一种字符类型');
                return null;
            }

            var length = parseInt(lengthRange.value);
            var password = '';
            for (var i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return password;
        }

        generateBtn.addEventListener('click', function() {
            var password = generatePassword();
            if (password) passwordText.textContent = password;
        });

        copyBtn.addEventListener('click', function() {
            var text = passwordText.textContent;
            if (!text || text === '点击"生成密码"按钮') { alert('请先生成密码'); return; }
            navigator.clipboard.writeText(text).then(function() {
                copyBtn.textContent = '已复制';
                setTimeout(function() { copyBtn.textContent = '复制密码'; }, 2000);
            });
        });

        batchBtn.addEventListener('click', function() {
            var count = parseInt(batchRange.value);
            var passwords = [];
            for (var i = 0; i < count; i++) {
                var pwd = generatePassword();
                if (pwd) passwords.push(pwd);
            }
            if (passwords.length > 0) {
                batchOutput.textContent = passwords.join('\n');
                batchResult.style.display = 'block';
            }
        });

        generateBtn.click();
    </script>
</body>
</html>
