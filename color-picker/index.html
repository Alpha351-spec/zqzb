<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="颜色选择器 - 在线拾色器，支持RGB/HEX颜色值转换，调色板功能。所有处理均在本地完成。">
    <title>颜色选择器 - 杂七杂八工具箱</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3874070867090849" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <noscript>
            <div style="background: #fff3cd; border: 1px solid #ffecb5; border-radius: 12px; padding: 16px; margin-bottom: 24px; color: #856404;">
                ⚠️ 您的浏览器未启用 JavaScript。本工具箱的所有工具都需要 JavaScript 支持才能正常运行，请启用 JavaScript 后重试。
            </div>
        </noscript>
        <nav class="nav-bar">
            <a href="../">← 返回工具箱</a>
            <a href="../base64-tool/">Base64编解码</a>
            <a href="../url-encode/">URL编解码</a>
            <a href="../unicode-convert/">Unicode转换</a>
            <a href="../color-picker/" class="active">颜色选择器</a>
        </nav>

        <main>
            <h1 class="tool-title">颜色选择器</h1>
            <p class="tool-desc">拾色器、RGB/HEX/HSL转换、调色板。所有处理均在本地完成。</p>

            <div class="input-group">
                <label for="colorPicker">选择颜色</label>
                <input type="color" id="colorPicker" value="#111111" style="width: 100%; height: 56px; border: 1px solid #eaeaea; cursor: pointer; border-radius: 12px; padding: 4px;">
            </div>

            <div class="color-display" id="colorDisplay"></div>

            <div class="color-values">
                <div class="color-value-item">
                    <label>HEX</label>
                    <input type="text" id="hexValue" readonly>
                    <button class="btn" onclick="copyValue('hexValue')" style="margin-top: 10px; width: 100%;">复制</button>
                </div>
                <div class="color-value-item">
                    <label>RGB</label>
                    <input type="text" id="rgbValue" readonly>
                    <button class="btn" onclick="copyValue('rgbValue')" style="margin-top: 10px; width: 100%;">复制</button>
                </div>
                <div class="color-value-item">
                    <label>HSL</label>
                    <input type="text" id="hslValue" readonly>
                    <button class="btn" onclick="copyValue('hslValue')" style="margin-top: 10px; width: 100%;">复制</button>
                </div>
            </div>

            <div class="input-group" style="margin-top: 40px;">
                <label for="hexInput">输入HEX值</label>
                <input type="text" id="hexInput" placeholder="#111111" maxlength="7">
            </div>

            <button class="btn" id="applyHexBtn">应用颜色</button>
        </main>

        <div class="recommend-section">
            <h3>其他工具</h3>
            <div class="recommend-links">
                <a href="../image-compress/">图片压缩</a>
                <a href="../qr-generator/">二维码生成</a>
                <a href="../json-formatter/">JSON格式化</a>
                <a href="../base64-tool/">Base64编解码</a>
            </div>
        </div>

        <footer>
            <p>&copy; <span class="current-year">2024</span> 杂七杂八工具箱 | <a href="../about.html">关于</a> | <a href="../privacy.html">隐私政策</a> | <a href="../guide.html">使用指南</a></p>
        </footer>
    </div>

    <script src="../js/common.js"></script>
    <script>
        var colorPicker = document.getElementById('colorPicker');
        var colorDisplay = document.getElementById('colorDisplay');
        var hexValue = document.getElementById('hexValue');
        var rgbValue = document.getElementById('rgbValue');
        var hslValue = document.getElementById('hslValue');
        var hexInput = document.getElementById('hexInput');
        var applyHexBtn = document.getElementById('applyHexBtn');

        function hexToRgb(hex) {
            var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHsl(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;

            var max = Math.max(r, g, b);
            var min = Math.min(r, g, b);
            var h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                var d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

                switch (max) {
                    case r:
                        h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
                        break;
                    case g:
                        h = ((b - r) / d + 2) / 6;
                        break;
                    case b:
                        h = ((r - g) / d + 4) / 6;
                        break;
                }
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        function updateColor(hex) {
            colorDisplay.style.backgroundColor = hex;
            colorPicker.value = hex;
            hexValue.value = hex.toUpperCase();

            var rgb = hexToRgb(hex);
            if (rgb) {
                rgbValue.value = 'rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')';

                var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
                hslValue.value = 'hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)';
            }
        }

        colorPicker.addEventListener('input', function() {
            updateColor(this.value);
        });

        applyHexBtn.addEventListener('click', function() {
            var hex = hexInput.value.trim();
            if (!hex) {
                alert('请输入HEX颜色值');
                return;
            }

            if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                alert('请输入有效的HEX颜色值，例如: #111111');
                return;
            }

            updateColor(hex);
        });

        function copyValue(elementId) {
            var input = document.getElementById(elementId);
            navigator.clipboard.writeText(input.value).then(function() {
                var btn = input.nextElementSibling;
                btn.textContent = '已复制';
                setTimeout(function() {
                    btn.textContent = '复制';
                }, 2000);
            }).catch(function() {
                alert('复制失败，请手动复制');
            });
        }

        updateColor('#111111');
    </script>
</body>
</html>
