<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Unicode转换 - 在线进行Unicode编码和解码，中文转\\u格式或反过来。所有处理均在本地完成。">
    <title>Unicode转换 - 杂七杂八工具箱</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3874070867090849" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <noscript>
            <div style="background: #fff3cd; border: 1px solid #ffecb5; border-radius: 12px; padding: 16px; margin-bottom: 24px; color: #856404;">
                ⚠️ 您的浏览器未启用 JavaScript。本工具箱的所有工具都需要 JavaScript 支持才能正常运行，请启用 JavaScript 后重试。
            </div>
        </noscript>
        <nav class="nav-bar">
            <a href="../">← 返回工具箱</a>
            <a href="../base64-tool/">Base64编解码</a>
            <a href="../url-encode/">URL编解码</a>
            <a href="../unicode-convert/" class="active">Unicode转换</a>
            <a href="../color-picker/">颜色选择器</a>
        </nav>

        <main>
            <h1 class="tool-title">Unicode转换</h1>
            <p class="tool-desc">进行Unicode编码和解码，中文转\\u格式或反过来。所有处理均在本地完成。</p>

            <div class="input-group">
                <label for="textInput">输入文本</label>
                <textarea id="textInput" placeholder="请输入中文文本或Unicode编码（如 \\u4e2d\\u6587）..."></textarea>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px;">
                <button class="btn btn-primary" id="toUnicodeBtn">中文转Unicode →</button>
                <button class="btn btn-primary" id="fromUnicodeBtn">← Unicode转中文</button>
                <button class="btn" id="copyInputBtn">复制输入</button>
                <button class="btn" id="copyOutputBtn">复制输出</button>
                <button class="btn" id="clearBtn">清空</button>
            </div>

            <div class="input-group">
                <label for="outputText">结果</label>
                <textarea id="outputText" placeholder="结果将显示在这里..." readonly></textarea>
            </div>
        </main>

        <div class="recommend-section">
            <h3>其他工具</h3>
            <div class="recommend-links">
                <a href="../base64-tool/">Base64编解码</a>
                <a href="../url-encode/">URL编解码</a>
            </div>
        </div>

        <footer>
            <p>&copy; <span class="current-year">2024</span> 杂七杂八工具箱 | <a href="../about.html">关于</a> | <a href="../privacy.html">隐私政策</a> | <a href="../guide.html">使用指南</a></p>
        </footer>
    </div>

    <script src="../js/common.js"></script>
    <script>
        var textInput = document.getElementById('textInput');
        var outputText = document.getElementById('outputText');
        var toUnicodeBtn = document.getElementById('toUnicodeBtn');
        var fromUnicodeBtn = document.getElementById('fromUnicodeBtn');
        var copyInputBtn = document.getElementById('copyInputBtn');
        var copyOutputBtn = document.getElementById('copyOutputBtn');
        var clearBtn = document.getElementById('clearBtn');

        toUnicodeBtn.addEventListener('click', function() {
            var text = textInput.value;
            if (!text) { alert('请输入文本'); return; }
            var result = '';
            for (var i = 0; i < text.length; i++) {
                var code = text.charCodeAt(i);
                if (code > 127) {
                    result += '\\u' + code.toString(16).padStart(4, '0');
                } else {
                    result += text[i];
                }
            }
            outputText.value = result;
        });

        fromUnicodeBtn.addEventListener('click', function() {
            var text = textInput.value;
            if (!text) { alert('请输入文本'); return; }
            try {
                outputText.value = text.replace(/\\u([0-9a-fA-F]{4})/g, function(match, grp) {
                    return String.fromCharCode(parseInt(grp, 16));
                });
            } catch (e) {
                alert('转换失败: Unicode格式不正确');
            }
        });

        copyInputBtn.addEventListener('click', function() {
            var text = textInput.value;
            if (!text) { alert('没有可复制的内容'); return; }
            navigator.clipboard.writeText(text).then(function() {
                copyInputBtn.textContent = '已复制';
                setTimeout(function() { copyInputBtn.textContent = '复制输入'; }, 2000);
            });
        });

        copyOutputBtn.addEventListener('click', function() {
            var text = outputText.value;
            if (!text) { alert('没有可复制的内容'); return; }
            navigator.clipboard.writeText(text).then(function() {
                copyOutputBtn.textContent = '已复制';
                setTimeout(function() { copyOutputBtn.textContent = '复制输出'; }, 2000);
            });
        });

        clearBtn.addEventListener('click', function() {
            textInput.value = '';
            outputText.value = '';
        });
    </script>
</body>
</html>
