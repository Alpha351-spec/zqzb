<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="二维码生成 - 在线免费生成二维码，支持文本和链接，可添加Logo，下载PNG图片。所有处理均在本地完成。">
    <title>二维码生成 - 杂七杂八工具箱</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3874070867090849" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <noscript>
            <div style="background: #fff3cd; border: 1px solid #ffecb5; border-radius: 12px; padding: 16px; margin-bottom: 24px; color: #856404;">
                ⚠️ 您的浏览器未启用 JavaScript。本工具箱的所有工具都需要 JavaScript 支持才能正常运行，请启用 JavaScript 后重试。
            </div>
        </noscript>
        <nav class="nav-bar">
            <a href="../">← 返回工具箱</a>
            <a href="../qr-generator/" class="active">二维码生成</a>
            <a href="../random-password/">随机密码</a>
            <a href="../timestamp/">时间戳转换</a>
            <a href="../random-number/">随机数生成</a>
            <a href="../uuid-generator/">UUID生成</a>
        </nav>

        <main>
            <h1 class="tool-title">二维码生成</h1>
            <p class="tool-desc">输入文本或链接，生成二维码。可选择添加Logo，下载PNG图片。</p>

            <div class="input-group">
                <label for="qrText">输入文本或链接</label>
                <textarea id="qrText" placeholder="请输入要生成二维码的文本或链接..."></textarea>
            </div>

            <div class="input-group">
                <label for="qrSize">二维码尺寸</label>
                <select id="qrSize">
                    <option value="128">128 x 128</option>
                    <option value="256" selected>256 x 256</option>
                    <option value="512">512 x 512</option>
                </select>
            </div>

            <div class="input-group">
                <label for="logoInput">添加Logo（可选）</label>
                <input type="file" id="logoInput" accept="image/*">
            </div>

            <button class="btn btn-primary" id="generateBtn">生成二维码</button>

            <div class="result-area" id="resultArea" style="display: none;">
                <div class="qr-result" id="qrResult"></div>
                <button class="btn" id="downloadBtn" style="margin-top: 20px;">下载二维码</button>
            </div>
        </main>

        <div class="recommend-section">
            <h3>其他工具</h3>
            <div class="recommend-links">
                <a href="../image-compress/">图片压缩</a>
                <a href="../json-formatter/">JSON格式化</a>
                <a href="../base64-tool/">Base64编解码</a>
                <a href="../color-picker/">颜色选择器</a>
            </div>
        </div>

        <footer>
            <p>&copy; <span class="current-year">2024</span> 杂七杂八工具箱 | <a href="../about.html">关于</a> | <a href="../privacy.html">隐私政策</a> | <a href="../guide.html">使用指南</a></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="../js/common.js"></script>
    <script>
        var qrText = document.getElementById('qrText');
        var qrSize = document.getElementById('qrSize');
        var logoInput = document.getElementById('logoInput');
        var generateBtn = document.getElementById('generateBtn');
        var resultArea = document.getElementById('resultArea');
        var qrResult = document.getElementById('qrResult');
        var downloadBtn = document.getElementById('downloadBtn');
        var qrCode = null;

        generateBtn.addEventListener('click', function() {
            var text = qrText.value.trim();
            if (!text) {
                alert('请输入文本或链接');
                return;
            }

            var size = parseInt(qrSize.value);

            qrResult.innerHTML = '';
            qrCode = new QRCode(qrResult, {
                text: text,
                width: size,
                height: size,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            var logoFile = logoInput.files[0];
            if (logoFile) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var canvas = qrResult.querySelector('canvas');
                    if (canvas) {
                        var ctx = canvas.getContext('2d');
                        var img = new Image();
                        img.onload = function() {
                            var logoSize = size * 0.2;
                            var x = (size - logoSize) / 2;
                            var y = (size - logoSize) / 2;
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(x - 5, y - 5, logoSize + 10, logoSize + 10);
                            ctx.drawImage(img, x, y, logoSize, logoSize);
                        };
                        img.src = e.target.result;
                    }
                };
                reader.readAsDataURL(logoFile);
            }

            resultArea.style.display = 'block';
        });

        downloadBtn.addEventListener('click', function() {
            var canvas = qrResult.querySelector('canvas');
            if (!canvas) return;

            var link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
