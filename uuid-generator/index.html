<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UUID生成器 - 在线生成UUID v4，支持批量生成。所有处理均在本地完成。">
    <title>UUID生成器 - 杂七杂八工具箱</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3874070867090849" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .uuid-display {
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .uuid-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 20px;
            color: #111111;
            word-break: break-all;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <noscript>
            <div style="background: #fff3cd; border: 1px solid #ffecb5; border-radius: 12px; padding: 16px; margin-bottom: 24px; color: #856404;">
                ⚠️ 您的浏览器未启用 JavaScript。本工具箱的所有工具都需要 JavaScript 支持才能正常运行，请启用 JavaScript 后重试。
            </div>
        </noscript>
        <nav class="nav-bar">
            <a href="../">← 返回工具箱</a>
            <a href="../qr-generator/">二维码生成</a>
            <a href="../random-password/">随机密码</a>
            <a href="../timestamp/">时间戳转换</a>
            <a href="../random-number/">随机数生成</a>
            <a href="../uuid-generator/" class="active">UUID生成</a>
        </nav>

        <main>
            <h1 class="tool-title">UUID生成器</h1>
            <p class="tool-desc">生成UUID v4，支持批量生成和一键复制。所有处理均在本地完成。</p>

            <div class="input-group">
                <label for="countInput">生成数量</label>
                <input type="number" id="countInput" value="1" min="1" max="100">
            </div>

            <div style="display: flex; gap: 12px; margin-bottom: 24px;">
                <button class="btn btn-primary" id="generateBtn">生成UUID</button>
                <button class="btn" id="copyBtn">复制结果</button>
            </div>

            <div class="uuid-display" id="uuidDisplay">
                <div class="uuid-text" id="uuidText">点击"生成UUID"按钮</div>
            </div>

            <div class="input-group">
                <label>格式选项</label>
                <div style="display: flex; gap: 16px;">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555555;">
                        <input type="radio" name="format" value="default" checked style="width: 18px; height: 18px; accent-color: #009DFF;">
                        标准格式
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555555;">
                        <input type="radio" name="format" value="no-dash" style="width: 18px; height: 18px; accent-color: #009DFF;">
                        无横线
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555555;">
                        <input type="radio" name="format" value="upper" style="width: 18px; height: 18px; accent-color: #009DFF;">
                        大写
                    </label>
                </div>
            </div>
        </main>

        <div class="recommend-section">
            <h3>其他工具</h3>
            <div class="recommend-links">
                <a href="../random-password/">随机密码</a>
                <a href="../random-number/">随机数生成</a>
            </div>
        </div>

        <footer>
            <p>&copy; <span class="current-year">2024</span> 杂七杂八工具箱 | <a href="../about.html">关于</a> | <a href="../privacy.html">隐私政策</a> | <a href="../guide.html">使用指南</a></p>
        </footer>
    </div>

    <script src="../js/common.js"></script>
    <script>
        var countInput = document.getElementById('countInput');
        var generateBtn = document.getElementById('generateBtn');
        var copyBtn = document.getElementById('copyBtn');
        var uuidText = document.getElementById('uuidText');
        var lastResult = '';

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                var v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        generateBtn.addEventListener('click', function() {
            var count = parseInt(countInput.value);
            if (isNaN(count) || count < 1) { alert('请输入有效的数量'); return; }

            var format = document.querySelector('input[name="format"]:checked').value;
            var uuids = [];

            for (var i = 0; i < count; i++) {
                var uuid = generateUUID();
                if (format === 'no-dash') uuid = uuid.replace(/-/g, '');
                if (format === 'upper') uuid = uuid.toUpperCase();
                uuids.push(uuid);
            }

            lastResult = uuids.join('\n');
            uuidText.textContent = lastResult;
        });

        copyBtn.addEventListener('click', function() {
            if (!lastResult) { alert('请先生成UUID'); return; }
            navigator.clipboard.writeText(lastResult).then(function() {
                copyBtn.textContent = '已复制';
                setTimeout(function() { copyBtn.textContent = '复制结果'; }, 2000);
            });
        });
    </script>
</body>
</html>
